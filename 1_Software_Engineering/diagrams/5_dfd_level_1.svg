<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 780" width="100%" height="100%">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Header -->
  <text x="525" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Data Flow Diagram (DFD) – Level 1</text>
  <text x="525" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Functional Decomposition: Sub-processes, Data Flows, and Data Stores</text>

  <!-- ================= ENTITY: ADMINISTRATOR (Top Left) ================= -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="140" height="90" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="4" />
    <rect width="140" height="24" fill="#fef3c7" rx="4" />
    <text x="70" y="17" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">ADMINISTRATOR</text>
    <text x="70" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569" text-anchor="middle">• Movie Master</text>
    <text x="70" y="70" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569" text-anchor="middle">• Screen Setup</text>
  </g>

  <!-- ================= PROCESS 1.0: MANAGE MOVIES & SCREENS ================= -->
  <g transform="translate(240, 90)" filter="url(#shadow)">
    <circle cx="50" cy="45" r="45" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <line x1="10" y1="30" x2="90" y2="30" stroke="#2563eb" stroke-width="1.5" />
    <text x="50" y="24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">1.0</text>
    <text x="50" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Manage Movies</text>
    <text x="50" y="62" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">&amp; Screens</text>
  </g>

  <!-- Flow Admin -> 1.0 -->
  <line x1="180" y1="135" x2="240" y2="135" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />
  <text x="210" y="125" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Catalog Data</text>

  <!-- ================= DATA STORES: D1 MOVIE & D2 SCREEN ================= -->
  <g transform="translate(400, 75)">
    <!-- D1 -->
    <path d="M 0 0 L 160 0 M 0 35 L 160 35" stroke="#0f172a" stroke-width="2" />
    <rect width="160" height="35" fill="#f1f5f9" />
    <text x="10" y="22" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#1e40af">D1</text>
    <text x="40" y="22" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Movie Store</text>

    <!-- D2 -->
    <g transform="translate(0, 55)">
      <path d="M 0 0 L 160 0 M 0 35 L 160 35" stroke="#0f172a" stroke-width="2" />
      <rect width="160" height="35" fill="#f1f5f9" />
      <text x="10" y="22" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#0e7490">D2</text>
      <text x="40" y="22" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Screen Store</text>
    </g>
  </g>

  <!-- Flow 1.0 -> D1 & D2 -->
  <line x1="330" y1="110" x2="400" y2="92" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />
  <line x1="330" y1="145" x2="400" y2="145" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />

  <!-- ================= PROCESS 2.0: SCHEDULE SHOWS ================= -->
  <g transform="translate(630, 90)" filter="url(#shadow)">
    <circle cx="50" cy="45" r="45" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <line x1="10" y1="30" x2="90" y2="30" stroke="#2563eb" stroke-width="1.5" />
    <text x="50" y="24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">2.0</text>
    <text x="50" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Schedule</text>
    <text x="50" y="62" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Shows &amp; Seats</text>
  </g>

  <!-- Read D1, D2 into 2.0 -->
  <line x1="560" y1="92" x2="630" y2="115" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />
  <line x1="560" y1="145" x2="630" y2="145" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />

  <!-- ================= DATA STORE D3: SHOW SCHEDULES ================= -->
  <g transform="translate(800, 110)">
    <path d="M 0 0 L 190 0 M 0 45 L 190 45" stroke="#0f172a" stroke-width="2" />
    <rect width="190" height="45" fill="#fdf4ff" />
    <text x="10" y="27" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#9333ea">D3</text>
    <text x="40" y="22" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#334155">Show Schedule &amp;</text>
    <text x="40" y="38" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Available Seats</text>
  </g>

  <!-- Flow 2.0 -> D3 -->
  <line x1="720" y1="135" x2="800" y2="135" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />
  <text x="760" y="125" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155" text-anchor="middle">New Shows</text>

  <!-- ================= ENTITY: CUSTOMER (Middle Left) ================= -->
  <g transform="translate(40, 310)" filter="url(#shadow)">
    <rect width="140" height="150" fill="#ffffff" stroke="#16a34a" stroke-width="2" rx="4" />
    <rect width="140" height="24" fill="#dcfce7" rx="4" />
    <text x="70" y="17" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">CUSTOMER</text>
    <text x="70" y="55" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569" text-anchor="middle">• Selects Show</text>
    <text x="70" y="75" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569" text-anchor="middle">• Books Tickets</text>
    <text x="70" y="95" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569" text-anchor="middle">• Cancels Order</text>
    <text x="70" y="115" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569" text-anchor="middle">• Receives Slip</text>
  </g>

  <!-- ================= PROCESS 3.0: BOOKING & CAPACITY VALIDATION ================= -->
  <g transform="translate(280, 270)" filter="url(#shadow)">
    <circle cx="55" cy="50" r="50" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <line x1="10" y1="32" x2="100" y2="32" stroke="#dc2626" stroke-width="1.5" />
    <text x="55" y="24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">3.0</text>
    <text x="55" y="50" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Book Tickets &amp;</text>
    <text x="55" y="66" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Validate</text>
    <text x="55" y="80" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Capacity</text>
  </g>

  <!-- Flow Customer -> 3.0 -->
  <line x1="180" y1="340" x2="280" y2="320" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />
  <text x="230" y="322" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Booking Req</text>

  <!-- Process 3.0 queries D3 for seats & updates D3 -->
  <path d="M 380 290 Q 750 250 820 160" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow1)" />
  <text x="640" y="240" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">Verify Seats &lt;= Available</text>

  <path d="M 830 160 Q 760 270 380 320" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow1)" />
  <text x="640" y="280" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#15803d" text-anchor="middle">Decrement Seats Atomically</text>

  <!-- ================= PROCESS 4.0: PROCESS PAYMENT & BILLING ================= -->
  <g transform="translate(500, 360)" filter="url(#shadow)">
    <circle cx="50" cy="45" r="45" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <line x1="10" y1="30" x2="90" y2="30" stroke="#16a34a" stroke-width="1.5" />
    <text x="50" y="24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">4.0</text>
    <text x="50" y="48" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Process Payment</text>
    <text x="50" y="64" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">&amp; Issue Ticket</text>
  </g>

  <!-- Flow 3.0 -> 4.0 -->
  <line x1="380" y1="345" x2="500" y2="390" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />
  <text x="430" y="360" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Amount Due</text>

  <!-- ================= DATA STORES D4: BOOKING & D5: PAYMENT ================= -->
  <g transform="translate(720, 360)">
    <!-- D4 -->
    <path d="M 0 0 L 160 0 M 0 35 L 160 35" stroke="#0f172a" stroke-width="2" />
    <rect width="160" height="35" fill="#fee2e2" />
    <text x="10" y="22" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#dc2626">D4</text>
    <text x="40" y="22" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Bookings Store</text>

    <!-- D5 -->
    <g transform="translate(0, 50)">
      <path d="M 0 0 L 160 0 M 0 35 L 160 35" stroke="#0f172a" stroke-width="2" />
      <rect width="160" height="35" fill="#d1fae5" />
      <text x="10" y="22" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#059669">D5</text>
      <text x="40" y="22" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Payments Store</text>
    </g>
  </g>

  <!-- Flow 4.0 writes to D4 & D5 -->
  <line x1="600" y1="390" x2="720" y2="380" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />
  <line x1="600" y1="415" x2="720" y2="425" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />

  <!-- Flow 4.0 returns Ticket Receipt to Customer -->
  <path d="M 505 425 Q 340 450 180 410" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow1)" />
  <text x="320" y="445" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Ticket Receipt Generated</text>

  <!-- ================= PROCESS 5.0: CANCELLATIONS & REFUNDS ================= -->
  <g transform="translate(280, 500)" filter="url(#shadow)">
    <circle cx="55" cy="50" r="50" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <line x1="10" y1="32" x2="100" y2="32" stroke="#ea580c" stroke-width="1.5" />
    <text x="55" y="24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">5.0</text>
    <text x="55" y="50" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Handle Cancel</text>
    <text x="55" y="66" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">&amp; Compute</text>
    <text x="55" y="80" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Refund</text>
  </g>

  <!-- Flow Customer -> 5.0 -->
  <line x1="180" y1="430" x2="285" y2="520" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />
  <text x="210" y="480" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Cancel Req</text>

  <!-- 5.0 reads D4, updates D3 (restores seats), writes to D6 -->
  <!-- D6: Cancellation Store -->
  <g transform="translate(500, 540)">
    <path d="M 0 0 L 160 0 M 0 35 L 160 35" stroke="#0f172a" stroke-width="2" />
    <rect width="160" height="35" fill="#ffedd5" />
    <text x="10" y="22" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#ea580c">D6</text>
    <text x="40" y="22" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Cancellations</text>
  </g>
  <line x1="390" y1="550" x2="500" y2="557" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow1)" />

  <!-- 5.0 restores seats back into D3 -->
  <path d="M 370 510 Q 750 490 850 160" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow1)" />
  <text x="730" y="485" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#c2410c" text-anchor="middle">Restore Available Seats</text>

  <!-- 5.0 sends refund slip to Customer -->
  <path d="M 280 570 Q 150 600 120 465" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow1)" />
  <text x="180" y="585" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#c2410c" text-anchor="middle">Refund Slip (90%/70%/0%)</text>

  <!-- ================= PROCESS 6.0: REPORTS & PYTHON ANALYTICS ================= -->
  <g transform="translate(730, 620)" filter="url(#shadow)">
    <circle cx="55" cy="50" r="50" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
    <line x1="10" y1="32" x2="100" y2="32" stroke="#7c3aed" stroke-width="1.5" />
    <text x="55" y="24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">6.0</text>
    <text x="55" y="50" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Generate Reports</text>
    <text x="55" y="66" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">&amp; Python</text>
    <text x="55" y="80" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Analytics</text>
  </g>

  <!-- D4, D5, D6 feed 6.0 -->
  <path d="M 780 445 L 780 620" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow1)" />
  <line x1="660" y1="565" x2="740" y2="635" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow1)" />

  <!-- 6.0 outputs to Analyst Entity -->
  <g transform="translate(900, 625)" filter="url(#shadow)">
    <rect width="130" height="90" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="4" />
    <rect width="130" height="24" fill="#ede9fe" rx="4" />
    <text x="65" y="17" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">DATA ANALYST</text>
    <text x="65" y="52" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• EDA Insights</text>
    <text x="65" y="70" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• Visualizations</text>
  </g>
  <line x1="840" y1="670" x2="900" y2="670" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow1)" />
</svg>
