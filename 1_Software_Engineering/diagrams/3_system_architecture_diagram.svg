<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="100%" height="100%">
  <defs>
    <marker id="archArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
    </marker>
    <marker id="dbArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
    <marker id="pyArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f1f5f9" />

  <!-- Title -->
  <text x="490" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Integrated System Architecture Diagram</text>
  <text x="490" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Seamless Integration: Java Application (JDK 27) ↔ MySQL Database (8.0) ↔ Python Analytics (Pandas/Seaborn)</text>

  <!-- ================= TIER 1: PRESENTATION TIER ================= -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="900" height="110" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <rect width="900" height="28" rx="8" fill="#e0f2fe" />
    <rect width="900" height="10" y="18" fill="#e0f2fe" />
    <text x="450" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">TIER 1: PRESENTATION LAYER (USER INTERFACE &amp; CLI)</text>
    
    <!-- Sub-boxes -->
    <rect x="30" y="45" width="250" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="155" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Customer Booking UI</text>
    <text x="155" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Browse Shows, Select Seats, Checkout</text>

    <rect x="325" y="45" width="250" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="450" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Admin Management Console</text>
    <text x="450" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Add Movies, Configure Screens, Schedule Shows</text>

    <rect x="620" y="45" width="250" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="745" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Operational Report Viewer</text>
    <text x="745" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Show-wise Occupancy &amp; Revenue Reports</text>
  </g>

  <!-- Arrow Tier 1 -> Tier 2 -->
  <line x1="490" y1="185" x2="490" y2="225" stroke="#0f172a" stroke-width="2.5" marker-end="url(#archArrow)" />
  <text x="510" y="210" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#475569">Console I/O Commands</text>

  <!-- ================= TIER 2: BUSINESS LOGIC (JAVA) ================= -->
  <g transform="translate(40, 225)" filter="url(#shadow)">
    <rect width="900" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <rect width="900" height="28" rx="8" fill="#dcfce7" />
    <rect width="900" height="10" y="18" fill="#dcfce7" />
    <text x="450" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">TIER 2: APPLICATION BUSINESS LOGIC LAYER (JAVA JDK 27)</text>

    <!-- Services -->
    <rect x="30" y="45" width="190" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="125" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Booking Service</text>
    <text x="125" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Capacity Validation</text>
    <text x="125" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Seat Locking</text>
    <text x="125" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Unique Booking IDs</text>

    <rect x="250" y="45" width="190" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="345" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Refund &amp; Cancellation</text>
    <text x="345" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Lead Time Tier Rules</text>
    <text x="345" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• 90% / 70% / 0% Refund</text>
    <text x="345" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Restores Available Seats</text>

    <rect x="470" y="45" width="190" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="565" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Concurrency Control</text>
    <text x="565" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Synchronized Methods</text>
    <text x="565" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Race Condition Safe</text>
    <text x="565" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Multi-threaded Simulator</text>

    <rect x="690" y="45" width="180" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="780" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Report &amp; Stream API</text>
    <text x="780" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Functional Aggregation</text>
    <text x="780" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Collectors.groupingBy</text>
    <text x="780" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Net Revenue Reduction</text>
  </g>

  <!-- Split arrows Tier 2 -> Tier 3 -->
  <line x1="280" y1="375" x2="280" y2="425" stroke="#0284c7" stroke-width="2.5" marker-end="url(#dbArrow)" />
  <text x="180" y="405" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">JDBC CRUD Transactions</text>

  <!-- ================= TIER 3: DATA PERSISTENCE (MYSQL) ================= -->
  <g transform="translate(40, 425)" filter="url(#shadow)">
    <rect width="460" height="260" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <rect width="460" height="28" rx="8" fill="#e0f2fe" />
    <rect width="460" height="10" y="18" fill="#e0f2fe" />
    <text x="230" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">TIER 3: DATA PERSISTENCE LAYER (MYSQL 8.0)</text>

    <!-- Database cylinder icon + tables -->
    <g transform="translate(25, 45)">
      <rect width="190" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="95" y="22" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">movie (ID, Title, Genre, Lang)</text>

      <rect y="45" width="190" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="95" y="67" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">screen (ID, Name, Capacity)</text>

      <rect y="90" width="190" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="95" y="112" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">show_schedule (Time, Price)</text>

      <rect y="135" width="190" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="95" y="157" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">customer (ID, Name, Phone)</text>
    </g>

    <g transform="translate(240, 45)">
      <rect width="195" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="97" y="22" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">booking (Status, Tickets, Total)</text>

      <rect y="45" width="195" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="97" y="67" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">cancellation (Refund, Fee)</text>

      <rect y="90" width="195" height="35" rx="4" fill="#fef08a" stroke="#ca8a04" />
      <text x="97" y="112" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#854d0e" text-anchor="middle">Triggers: Auto Seat Decrement</text>

      <rect y="135" width="195" height="35" rx="4" fill="#ddd6fe" stroke="#7c3aed" />
      <text x="97" y="157" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">Views: Reporting &amp; Export</text>
    </g>
    <text x="230" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">ACID Compliant Transactions • BCNF Normalized Relations</text>
  </g>

  <!-- Horizontal connector: MySQL -> Python Analytics -->
  <line x1="500" y1="540" x2="540" y2="540" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#pyArrow)" />
  <text x="520" y="525" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed" text-anchor="middle">CSV / SQL Feed</text>

  <!-- ================= TIER 4: PYTHON DATA SCIENCE ================= -->
  <g transform="translate(540, 425)" filter="url(#shadow)">
    <rect width="400" height="260" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
    <rect width="400" height="28" rx="8" fill="#ede9fe" />
    <rect width="400" height="10" y="18" fill="#ede9fe" />
    <text x="200" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">TIER 4: DATA SCIENCE &amp; ANALYTICS (PYTHON 3.10+)</text>

    <rect x="25" y="45" width="350" height="42" rx="5" fill="#f5f3ff" stroke="#c4b5fd" />
    <text x="200" y="65" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">Data Wrangling &amp; Preprocessing (Pandas / NumPy)</text>
    <text x="200" y="78" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Missing Value Imputation, Type Casting, Outlier Detection (IQR)</text>

    <rect x="25" y="98" width="350" height="42" rx="5" fill="#f5f3ff" stroke="#c4b5fd" />
    <text x="200" y="118" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">Descriptive Statistics &amp; Modeling</text>
    <text x="200" y="131" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Mean, Median, Mode, Variance, Z-Scores, Two-Way Pivot Tables</text>

    <rect x="25" y="150" width="350" height="50" rx="5" fill="#f5f3ff" stroke="#c4b5fd" />
    <text x="200" y="170" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">Visualization Engine (Matplotlib / Seaborn)</text>
    <text x="200" y="185" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Revenue Bar Charts, Donut Share, Screen Box Plots, Correlation Heatmaps</text>

    <rect x="25" y="208" width="350" height="35" rx="5" fill="#faf5ff" stroke="#a855f7" />
    <text x="200" y="230" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#7e22ce" text-anchor="middle">Interactive Web Dashboard (Chart.js HTML)</text>
  </g>
</svg>
