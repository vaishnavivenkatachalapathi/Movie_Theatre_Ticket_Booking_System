<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" width="100%" height="100%">
  <defs>
    <marker id="actArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Header -->
  <text x="550" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">UML Activity Diagram</text>
  <text x="550" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Step-by-Step Behavioral Workflows: Ticket Booking &amp; Cancellation with Business Rules</text>

  <!-- ================= SECTION A: TICKET BOOKING WORKFLOW (Left) ================= -->
  <g transform="translate(40, 75)">
    <!-- Container Box -->
    <rect width="480" height="735" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
    <rect width="480" height="30" rx="8" fill="#dbeafe" />
    <rect width="480" height="10" y="20" fill="#dbeafe" />
    <text x="240" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">WORKFLOW A: TICKET RESERVATION &amp; CAPACITY VALIDATION</text>

    <!-- Initial Node -->
    <circle cx="240" cy="65" r="12" fill="#0f172a" />
    <line x1="240" y1="77" x2="240" y2="105" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 1: Browse Movies -->
    <rect x="140" y="105" width="200" height="40" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="240" y="130" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Browse Movies &amp; Shows</text>
    <line x1="240" y1="145" x2="240" y2="175" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 2: Select Show & Ticket Count -->
    <rect x="130" y="175" width="220" height="40" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="240" y="200" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Select Show &amp; Enter Ticket Count</text>
    <line x1="240" y1="215" x2="240" y2="245" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Decision 1: Seats Available? -->
    <polygon points="240,245 285,275 240,305 195,275" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="240" y="278" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Available?</text>

    <!-- Branch [No]: Overbooking Error -->
    <line x1="195" y1="275" x2="110" y2="275" stroke="#dc2626" stroke-width="2" marker-end="url(#actArrow)" />
    <text x="150" y="265" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">[No]</text>
    
    <rect x="10" y="255" width="100" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="60" y="272" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">Overbooking</text>
    <text x="60" y="285" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">Exception</text>

    <!-- Final node for overbooking error -->
    <circle cx="60" cy="325" r="12" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <circle cx="60" cy="325" r="7" fill="#dc2626" />
    <line x1="60" y1="295" x2="60" y2="313" stroke="#dc2626" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Branch [Yes]: Lock Seats & Decrement -->
    <line x1="240" y1="305" x2="240" y2="345" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />
    <text x="255" y="325" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="start">[Yes]</text>

    <!-- Action 3: Synchronized Seat Lock -->
    <rect x="120" y="345" width="240" height="45" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="240" y="365" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Acquire Synchronized Lock</text>
    <text x="240" y="380" font-family="Segoe UI, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Decrement Seats Atomically in Show</text>
    <line x1="240" y1="390" x2="240" y2="420" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 4: Calculate Total Amount -->
    <rect x="130" y="420" width="220" height="40" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="240" y="438" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Calculate Total Price</text>
    <text x="240" y="452" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(Tickets × Price)</text>
    <line x1="240" y1="460" x2="240" y2="490" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 5: Customer Contact & Payment -->
    <rect x="130" y="490" width="220" height="40" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="240" y="515" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Enter Customer Details &amp; Pay</text>
    <line x1="240" y1="530" x2="240" y2="560" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 6: Record in Database -->
    <rect x="120" y="560" width="240" height="40" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="240" y="585" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">INSERT INTO bookings &amp; payments</text>
    <line x1="240" y1="600" x2="240" y2="630" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 7: Generate Receipt -->
    <rect x="120" y="630" width="240" height="40" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="240" y="655" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Print Formatted Ticket Receipt</text>
    <line x1="240" y1="670" x2="240" y2="700" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Booking Final Node -->
    <circle cx="240" cy="712" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <circle cx="240" cy="712" r="7" fill="#0f172a" />
  </g>

  <!-- ================= SECTION B: CANCELLATION & REFUND (Right) ================= -->
  <g transform="translate(560, 75)">
    <!-- Container Box -->
    <rect width="480" height="735" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#shadow)" />
    <rect width="480" height="30" rx="8" fill="#ffedd5" />
    <rect width="480" height="10" y="20" fill="#ffedd5" />
    <text x="240" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">WORKFLOW B: BOOKING CANCELLATION &amp; REFUND RULES</text>

    <!-- Initial Node -->
    <circle cx="240" cy="65" r="12" fill="#0f172a" />
    <line x1="240" y1="77" x2="240" y2="105" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 1: Enter Booking ID -->
    <rect x="140" y="105" width="200" height="40" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8" />
    <text x="240" y="130" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#9a3412" text-anchor="middle">Enter Booking ID to Cancel</text>
    <line x1="240" y1="145" x2="240" y2="175" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 2: Verify Status -->
    <rect x="130" y="175" width="220" height="40" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8" />
    <text x="240" y="200" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#9a3412" text-anchor="middle">Query Booking Status &amp; Showtime</text>
    <line x1="240" y1="215" x2="240" y2="245" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Decision 2: Confirmed? -->
    <polygon points="240,245 285,275 240,305 195,275" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="240" y="278" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Confirmed?</text>

    <!-- Branch [No]: Already cancelled error -->
    <line x1="195" y1="275" x2="110" y2="275" stroke="#dc2626" stroke-width="2" marker-end="url(#actArrow)" />
    <text x="150" y="265" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">[No]</text>
    
    <rect x="10" y="255" width="100" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="60" y="272" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">Invalid /</text>
    <text x="60" y="285" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">Cancelled</text>

    <circle cx="60" cy="325" r="12" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <circle cx="60" cy="325" r="7" fill="#dc2626" />
    <line x1="60" y1="295" x2="60" y2="313" stroke="#dc2626" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Branch [Yes]: Compute Lead Time -->
    <line x1="240" y1="305" x2="240" y2="340" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />
    <text x="255" y="325" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="start">[Yes]</text>

    <!-- Action 3: Compute Lead Time Hours -->
    <rect x="120" y="340" width="240" height="40" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8" />
    <text x="240" y="364" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#9a3412" text-anchor="middle">Calculate Lead Time (Hours to Show)</text>
    <line x1="240" y1="380" x2="240" y2="405" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Tier Decision Diamond -->
    <polygon points="240,405 285,435 240,465 195,435" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="240" y="438" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Lead Time?</text>

    <!-- Tier 1: > 24 Hours -->
    <line x1="195" y1="435" x2="70" y2="435" stroke="#0f172a" stroke-width="1.8" />
    <line x1="70" y1="435" x2="70" y2="480" stroke="#0f172a" stroke-width="1.8" marker-end="url(#actArrow)" />
    <text x="120" y="425" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#16a34a">T &gt;= 24h</text>
    <rect x="10" y="480" width="120" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="70" y="498" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Refund = 90%</text>
    <text x="70" y="512" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155" text-anchor="middle">(10% Fee)</text>

    <!-- Tier 2: 2h <= T < 24h -->
    <line x1="240" y1="465" x2="240" y2="480" stroke="#0f172a" stroke-width="1.8" marker-end="url(#actArrow)" />
    <text x="245" y="475" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#d97706">2h &lt;= T &lt; 24h</text>
    <rect x="180" y="480" width="120" height="42" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" />
    <text x="240" y="498" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#854d0e" text-anchor="middle">Refund = 70%</text>
    <text x="240" y="512" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155" text-anchor="middle">(30% Fee)</text>

    <!-- Tier 3: < 2 Hours -->
    <line x1="285" y1="435" x2="410" y2="435" stroke="#0f172a" stroke-width="1.8" />
    <line x1="410" y1="435" x2="410" y2="480" stroke="#0f172a" stroke-width="1.8" marker-end="url(#actArrow)" />
    <text x="350" y="425" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">T &lt; 2h</text>
    <rect x="350" y="480" width="120" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="410" y="498" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">Refund = 0%</text>
    <text x="410" y="512" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155" text-anchor="middle">(100% Fee)</text>

    <!-- Merge lines to common action -->
    <line x1="70" y1="522" x2="70" y2="550" stroke="#0f172a" stroke-width="1.8" />
    <line x1="240" y1="522" x2="240" y2="550" stroke="#0f172a" stroke-width="1.8" />
    <line x1="410" y1="522" x2="410" y2="550" stroke="#0f172a" stroke-width="1.8" />
    <line x1="70" y1="550" x2="410" y2="550" stroke="#0f172a" stroke-width="1.8" />
    <line x1="240" y1="550" x2="240" y2="575" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 4: Restore Seats to Inventory -->
    <rect x="120" y="575" width="240" height="40" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="240" y="600" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Release &amp; Restore Available Seats</text>
    <line x1="240" y1="615" x2="240" y2="640" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Action 5: Update DB & Cancellation Table -->
    <rect x="120" y="640" width="240" height="40" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8" />
    <text x="240" y="665" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#9a3412" text-anchor="middle">UPDATE status &amp; Disburse Refund</text>
    <line x1="240" y1="680" x2="240" y2="700" stroke="#0f172a" stroke-width="2" marker-end="url(#actArrow)" />

    <!-- Cancellation Final Node -->
    <circle cx="240" cy="712" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <circle cx="240" cy="712" r="7" fill="#0f172a" />
  </g>
</svg>
