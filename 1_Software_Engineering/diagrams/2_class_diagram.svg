<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%">
  <defs>
    <marker id="inheritance" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    </marker>
    <marker id="composition" viewBox="0 0 16 12" refX="0" refY="6" markerWidth="12" markerHeight="9" orient="auto">
      <path d="M 0 6 L 8 0 L 16 6 L 8 12 z" fill="#1e293b" />
    </marker>
    <marker id="aggregation" viewBox="0 0 16 12" refX="0" refY="6" markerWidth="12" markerHeight="9" orient="auto">
      <path d="M 0 6 L 8 0 L 16 6 L 8 12 z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b" />
    </marker>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Header -->
  <text x="575" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Object-Oriented Class Diagram</text>
  <text x="575" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Showing Attributes, Methods, Visibility (+/-/#), Multiplicities and OOP Design Patterns</text>

  <!-- ================= CLASS: PERSON (Abstract) ================= -->
  <g transform="translate(480, 80)" filter="url(#boxShadow)">
    <rect width="200" height="130" fill="#ffffff" stroke="#475569" stroke-width="2" rx="4" />
    <rect width="200" height="28" fill="#f1f5f9" rx="4" />
    <text x="100" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text x="100" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Person</text>
    <line x1="0" y1="45" x2="200" y2="45" stroke="#475569" stroke-width="1" />
    <text x="10" y="62" font-family="Consolas, monospace" font-size="11" fill="#334155"># id: int</text>
    <text x="10" y="78" font-family="Consolas, monospace" font-size="11" fill="#334155"># name: String</text>
    <text x="10" y="94" font-family="Consolas, monospace" font-size="11" fill="#334155"># phone: String</text>
    <line x1="0" y1="102" x2="200" y2="102" stroke="#475569" stroke-width="1" />
    <text x="10" y="120" font-family="Consolas, monospace" font-size="11" fill="#334155">+ getRoleDesc(): String*</text>
  </g>

  <!-- ================= CLASS: CUSTOMER ================= -->
  <g transform="translate(320, 260)" filter="url(#boxShadow)">
    <rect width="220" height="110" fill="#ffffff" stroke="#16a34a" stroke-width="2" rx="4" />
    <rect width="220" height="28" fill="#dcfce7" rx="4" />
    <text x="110" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Customer</text>
    <line x1="0" y1="28" x2="220" y2="28" stroke="#16a34a" stroke-width="1" />
    <text x="10" y="46" font-family="Consolas, monospace" font-size="11" fill="#334155">- email: String</text>
    <line x1="0" y1="56" x2="220" y2="56" stroke="#16a34a" stroke-width="1" />
    <text x="10" y="74" font-family="Consolas, monospace" font-size="11" fill="#334155">+ bookTicket(show, n): Booking</text>
    <text x="10" y="92" font-family="Consolas, monospace" font-size="11" fill="#334155">+ cancelBooking(id): Cancel</text>
  </g>

  <!-- ================= CLASS: ADMIN ================= -->
  <g transform="translate(620, 260)" filter="url(#boxShadow)">
    <rect width="220" height="110" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="4" />
    <rect width="220" height="28" fill="#fef3c7" rx="4" />
    <text x="110" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Administrator</text>
    <line x1="0" y1="28" x2="220" y2="28" stroke="#d97706" stroke-width="1" />
    <text x="10" y="46" font-family="Consolas, monospace" font-size="11" fill="#334155">- adminLevel: String</text>
    <line x1="0" y1="56" x2="220" y2="56" stroke="#d97706" stroke-width="1" />
    <text x="10" y="74" font-family="Consolas, monospace" font-size="11" fill="#334155">+ addMovie(movie): void</text>
    <text x="10" y="92" font-family="Consolas, monospace" font-size="11" fill="#334155">+ scheduleShow(show): void</text>
  </g>

  <!-- Inheritance lines: Customer and Admin to Person -->
  <line x1="430" y1="260" x2="550" y2="210" stroke="#1e293b" stroke-width="2" marker-end="url(#inheritance)" />
  <line x1="730" y1="260" x2="610" y2="210" stroke="#1e293b" stroke-width="2" marker-end="url(#inheritance)" />

  <!-- ================= CLASS: MOVIE ================= -->
  <g transform="translate(40, 430)" filter="url(#boxShadow)">
    <rect width="220" height="150" fill="#ffffff" stroke="#2563eb" stroke-width="2" rx="4" />
    <rect width="220" height="28" fill="#dbeafe" rx="4" />
    <text x="110" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Movie</text>
    <line x1="0" y1="28" x2="220" y2="28" stroke="#2563eb" stroke-width="1" />
    <text x="10" y="45" font-family="Consolas, monospace" font-size="11" fill="#334155">- movieId: int</text>
    <text x="10" y="61" font-family="Consolas, monospace" font-size="11" fill="#334155">- title: String</text>
    <text x="10" y="77" font-family="Consolas, monospace" font-size="11" fill="#334155">- genre: String</text>
    <text x="10" y="93" font-family="Consolas, monospace" font-size="11" fill="#334155">- language: String</text>
    <text x="10" y="109" font-family="Consolas, monospace" font-size="11" fill="#334155">- durationMinutes: int</text>
    <line x1="0" y1="117" x2="220" y2="117" stroke="#2563eb" stroke-width="1" />
    <text x="10" y="135" font-family="Consolas, monospace" font-size="11" fill="#334155">+ getTitle(): String</text>
  </g>

  <!-- ================= CLASS: SCREEN ================= -->
  <g transform="translate(40, 630)" filter="url(#boxShadow)">
    <rect width="220" height="120" fill="#ffffff" stroke="#0891b2" stroke-width="2" rx="4" />
    <rect width="220" height="28" fill="#cffafe" rx="4" />
    <text x="110" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0e7490" text-anchor="middle">Screen</text>
    <line x1="0" y1="28" x2="220" y2="28" stroke="#0891b2" stroke-width="1" />
    <text x="10" y="45" font-family="Consolas, monospace" font-size="11" fill="#334155">- screenId: int</text>
    <text x="10" y="61" font-family="Consolas, monospace" font-size="11" fill="#334155">- screenName: String</text>
    <text x="10" y="77" font-family="Consolas, monospace" font-size="11" fill="#334155">- seatingCapacity: int</text>
    <line x1="0" y1="85" x2="220" y2="85" stroke="#0891b2" stroke-width="1" />
    <text x="10" y="103" font-family="Consolas, monospace" font-size="11" fill="#334155">+ getCapacity(): int</text>
  </g>

  <!-- ================= CLASS: SHOWSCHEDULE ================= -->
  <g transform="translate(340, 480)" filter="url(#boxShadow)">
    <rect width="250" height="220" fill="#ffffff" stroke="#9333ea" stroke-width="2" rx="4" />
    <rect width="250" height="28" fill="#f3e8ff" rx="4" />
    <text x="125" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="middle">ShowSchedule</text>
    <line x1="0" y1="28" x2="250" y2="28" stroke="#9333ea" stroke-width="1" />
    <text x="10" y="45" font-family="Consolas, monospace" font-size="11" fill="#334155">- showId: int</text>
    <text x="10" y="61" font-family="Consolas, monospace" font-size="11" fill="#334155">- movie: Movie</text>
    <text x="10" y="77" font-family="Consolas, monospace" font-size="11" fill="#334155">- screen: Screen</text>
    <text x="10" y="93" font-family="Consolas, monospace" font-size="11" fill="#334155">- showDate: String</text>
    <text x="10" y="109" font-family="Consolas, monospace" font-size="11" fill="#334155">- showTime: String</text>
    <text x="10" y="125" font-family="Consolas, monospace" font-size="11" fill="#334155">- ticketPrice: double</text>
    <text x="10" y="141" font-family="Consolas, monospace" font-size="11" fill="#334155">- availableSeats: int</text>
    <line x1="0" y1="149" x2="250" y2="149" stroke="#9333ea" stroke-width="1" />
    <text x="10" y="167" font-family="Consolas, monospace" font-size="11" fill="#334155">+ synchronized reserveSeats(n)</text>
    <text x="10" y="185" font-family="Consolas, monospace" font-size="11" fill="#334155">+ synchronized releaseSeats(n)</text>
    <text x="10" y="203" font-family="Consolas, monospace" font-size="11" fill="#334155">+ getOccupancyPct(): double</text>
  </g>

  <!-- Aggregations: Movie & Screen to ShowSchedule -->
  <line x1="260" y1="510" x2="340" y2="530" stroke="#1e293b" stroke-width="2" marker-start="url(#aggregation)" />
  <text x="270" y="500" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1</text>
  <text x="325" y="520" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1..*</text>

  <line x1="260" y1="670" x2="340" y2="630" stroke="#1e293b" stroke-width="2" marker-start="url(#aggregation)" />
  <text x="270" y="685" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1</text>
  <text x="325" y="640" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1..*</text>

  <!-- ================= CLASS: BOOKING ================= -->
  <g transform="translate(660, 480)" filter="url(#boxShadow)">
    <rect width="230" height="180" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="4" />
    <rect width="230" height="28" fill="#fee2e2" rx="4" />
    <text x="115" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">Booking</text>
    <line x1="0" y1="28" x2="230" y2="28" stroke="#dc2626" stroke-width="1" />
    <text x="10" y="45" font-family="Consolas, monospace" font-size="11" fill="#334155">- bookingId: int</text>
    <text x="10" y="61" font-family="Consolas, monospace" font-size="11" fill="#334155">- customer: Customer</text>
    <text x="10" y="77" font-family="Consolas, monospace" font-size="11" fill="#334155">- show: ShowSchedule</text>
    <text x="10" y="93" font-family="Consolas, monospace" font-size="11" fill="#334155">- numberOfTickets: int</text>
    <text x="10" y="109" font-family="Consolas, monospace" font-size="11" fill="#334155">- totalAmount: double</text>
    <text x="10" y="125" font-family="Consolas, monospace" font-size="11" fill="#334155">- status: BookingStatus</text>
    <line x1="0" y1="133" x2="230" y2="133" stroke="#dc2626" stroke-width="1" />
    <text x="10" y="152" font-family="Consolas, monospace" font-size="11" fill="#334155">+ generateReceipt(): String</text>
    <text x="10" y="168" font-family="Consolas, monospace" font-size="11" fill="#334155">+ setStatus(status): void</text>
  </g>

  <!-- Association: Customer to Booking -->
  <line x1="480" y1="370" x2="720" y2="480" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="390" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1</text>
  <text x="690" y="465" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">0..*</text>

  <!-- Association: ShowSchedule to Booking -->
  <line x1="590" y1="560" x2="660" y2="560" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="600" y="550" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1</text>
  <text x="645" y="550" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">0..*</text>

  <!-- ================= CLASS: CANCELLATION ================= -->
  <g transform="translate(930, 480)" filter="url(#boxShadow)">
    <rect width="200" height="150" fill="#ffffff" stroke="#ea580c" stroke-width="2" rx="4" />
    <rect width="200" height="28" fill="#ffedd5" rx="4" />
    <text x="100" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">Cancellation</text>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#ea580c" stroke-width="1" />
    <text x="10" y="45" font-family="Consolas, monospace" font-size="11" fill="#334155">- cancellationId: int</text>
    <text x="10" y="61" font-family="Consolas, monospace" font-size="11" fill="#334155">- booking: Booking</text>
    <text x="10" y="77" font-family="Consolas, monospace" font-size="11" fill="#334155">- refundAmount: double</text>
    <text x="10" y="93" font-family="Consolas, monospace" font-size="11" fill="#334155">- cancellationFee: double</text>
    <line x1="0" y1="103" x2="200" y2="103" stroke="#ea580c" stroke-width="1" />
    <text x="10" y="125" font-family="Consolas, monospace" font-size="11" fill="#334155">+ generateSlip(): String</text>
  </g>

  <!-- Composition/Association: Booking to Cancellation (1 to 0..1) -->
  <line x1="890" y1="540" x2="930" y2="540" stroke="#1e293b" stroke-width="2" marker-start="url(#aggregation)" />
  <text x="895" y="530" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1</text>
  <text x="910" y="530" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">0..1</text>

  <!-- ================= CLASS: PAYMENT ================= -->
  <g transform="translate(660, 690)" filter="url(#boxShadow)">
    <rect width="230" height="110" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="4" />
    <rect width="230" height="26" fill="#d1fae5" rx="4" />
    <text x="115" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Payment</text>
    <line x1="0" y1="26" x2="230" y2="26" stroke="#10b981" stroke-width="1" />
    <text x="10" y="44" font-family="Consolas, monospace" font-size="11" fill="#334155">- paymentId: int</text>
    <text x="10" y="59" font-family="Consolas, monospace" font-size="11" fill="#334155">- paymentMode: String</text>
    <text x="10" y="74" font-family="Consolas, monospace" font-size="11" fill="#334155">- amount: double</text>
    <text x="10" y="89" font-family="Consolas, monospace" font-size="11" fill="#334155">- paymentStatus: String</text>
  </g>

  <!-- Composition: Booking to Payment (1 to 1) -->
  <line x1="775" y1="660" x2="775" y2="690" stroke="#1e293b" stroke-width="2" marker-start="url(#composition)" />
  <text x="785" y="675" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1</text>
  <text x="785" y="685" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">1</text>
</svg>
