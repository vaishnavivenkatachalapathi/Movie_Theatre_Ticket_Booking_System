<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="barGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="barGrad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3" flood-color="#000" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="950" height="580" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Header Card -->
  <rect x="35" y="25" width="880" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="55" y="55" fill="#f8fafc" font-size="20" font-weight="bold">Movie Popularity Analysis (Total Tickets Sold)</text>
  <text x="55" y="78" fill="#94a3b8" font-size="13">Scenario 30: Velalar Cinemas • Volume of Tickets Sold Across Catalog (Not Monetary Revenue)</text>
  <rect x="760" y="42" width="135" height="30" rx="6" fill="#0284c7" />
  <text x="827" y="62" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">25ITC31 - FDS</text>

  <!-- Chart Area Grid & Axis -->
  <!-- Left Margin: 250, Chart Width: 620 (250 to 870), Y Range: 130 to 470 -->
  <!-- Max Tickets = 30; scale: 600px / 30 = 20px per ticket -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4">
    <line x1="250" y1="130" x2="250" y2="470" stroke-dasharray="0" stroke="#64748b" stroke-width="1.5" />
    <line x1="350" y1="130" x2="350" y2="470" />
    <line x1="450" y1="130" x2="450" y2="470" />
    <line x1="550" y1="130" x2="550" y2="470" />
    <line x1="650" y1="130" x2="650" y2="470" />
    <line x1="750" y1="130" x2="750" y2="470" />
    <line x1="850" y1="130" x2="850" y2="470" />
  </g>

  <!-- X-Axis Labels -->
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="250" y="492">0</text>
    <text x="350" y="492">5</text>
    <text x="450" y="492">10</text>
    <text x="550" y="492">15</text>
    <text x="650" y="492">20</text>
    <text x="750" y="492">25</text>
    <text x="850" y="492">30</text>
    <text x="550" y="525" fill="#cbd5e1" font-size="13" font-weight="600">Total Number of Tickets Sold</text>
  </g>

  <!-- Horizontal Bars & Labels -->
  <!-- Bar 1: Avatar: The Way of Water (27 tickets = 540px width) -->
  <text x="235" y="162" fill="#f8fafc" font-size="13" font-weight="500" text-anchor="end">Avatar: The Way of Water</text>
  <rect x="250" y="142" width="540" height="30" rx="5" fill="url(#barGrad1)" filter="url(#dropShadow)" />
  <text x="800" y="162" fill="#38bdf8" font-size="13" font-weight="bold">27 tickets (28.7%)</text>

  <!-- Bar 2: Jailer (26 tickets = 520px width) -->
  <text x="235" y="217" fill="#f8fafc" font-size="13" font-weight="500" text-anchor="end">Jailer</text>
  <rect x="250" y="197" width="520" height="30" rx="5" fill="url(#barGrad2)" filter="url(#dropShadow)" />
  <text x="780" y="217" fill="#818cf8" font-size="13" font-weight="bold">26 tickets (27.7%)</text>

  <!-- Bar 3: Ponniyin Selvan Part 2 (12 tickets = 240px width) -->
  <text x="235" y="272" fill="#f8fafc" font-size="13" font-weight="500" text-anchor="end">Ponniyin Selvan Part 2</text>
  <rect x="250" y="252" width="240" height="30" rx="5" fill="url(#barGrad3)" filter="url(#dropShadow)" />
  <text x="500" y="272" fill="#34d399" font-size="13" font-weight="bold">12 tickets (12.8%)</text>

  <!-- Bar 4: Leo (10 tickets = 200px width) -->
  <text x="235" y="327" fill="#f8fafc" font-size="13" font-weight="500" text-anchor="end">Leo</text>
  <rect x="250" y="307" width="200" height="30" rx="5" fill="url(#barGrad4)" filter="url(#dropShadow)" />
  <text x="460" y="327" fill="#f472b6" font-size="13" font-weight="bold">10 tickets (10.6%)</text>

  <!-- Bar 5: Interstellar: Re-release (10 tickets = 200px width) -->
  <text x="235" y="382" fill="#f8fafc" font-size="13" font-weight="500" text-anchor="end">Interstellar: Re-release</text>
  <rect x="250" y="362" width="200" height="30" rx="5" fill="url(#barGrad5)" filter="url(#dropShadow)" />
  <text x="460" y="382" fill="#fbbf24" font-size="13" font-weight="bold">10 tickets (10.6%)</text>

  <!-- Bar 6: Oppenheimer (9 tickets = 180px width) -->
  <text x="235" y="437" fill="#f8fafc" font-size="13" font-weight="500" text-anchor="end">Oppenheimer</text>
  <rect x="250" y="417" width="180" height="30" rx="5" fill="url(#barGrad6)" filter="url(#dropShadow)" />
  <text x="440" y="437" fill="#a78bfa" font-size="13" font-weight="bold">9 tickets (9.6%)</text>

  <!-- Footer Information -->
  <line x1="35" y1="545" x2="915" y2="545" stroke="#334155" stroke-width="1" />
  <text x="45" y="565" fill="#64748b" font-size="11">Total Volume Sold: 94 Tickets across 25 Transactions | Ingested Dataset: theatre_bookings.csv</text>
  <text x="905" y="565" fill="#64748b" font-size="11" text-anchor="end">Velalar College of Engineering and Technology (Autonomous)</text>
</svg>
