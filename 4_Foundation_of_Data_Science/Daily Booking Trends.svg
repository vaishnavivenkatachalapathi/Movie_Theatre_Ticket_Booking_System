<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="950" height="580" rx="14" fill="url(#bgGrad2)" stroke="#312e81" stroke-width="2"/>

  <!-- Header Card -->
  <rect x="35" y="25" width="880" height="75" rx="8" fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5" />
  <text x="55" y="55" fill="#f8fafc" font-size="20" font-weight="bold">Daily Booking Trends &amp; Ticket Velocity</text>
  <text x="55" y="78" fill="#a5b4fc" font-size="13">Scenario 30: Day-by-Day Progression of Bookings and Tickets Issued (Nov 10 – Nov 15, 2026)</text>
  <rect x="760" y="42" width="135" height="30" rx="6" fill="#4f46e5" />
  <text x="827" y="62" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">25ITC31 - FDS</text>

  <!-- Chart Dimensions: X: 100 to 860 (width 760), Y: 130 to 460 (height 330) -->
  <!-- 6 Days: X step = 760 / 5 = 152 px -->
  <!-- Day 0: 2026-11-10 -> x=120 -->
  <!-- Day 1: 2026-11-11 -> x=268 -->
  <!-- Day 2: 2026-11-12 -> x=416 -->
  <!-- Day 3: 2026-11-13 -> x=564 -->
  <!-- Day 4: 2026-11-14 -> x=712 -->
  <!-- Day 5: 2026-11-15 -> x=860 -->
  <!-- Max Tickets = 55; Y range 460 (0 tkts) to 140 (55 tkts); scale = 320px / 55 = 5.818 px/ticket -->
  <!-- Y positions for ticket counts:
       0 tkt: 460
       10 tkt: 460 - 58.18 = 401.8
       20 tkt: 460 - 116.36 = 343.6
       30 tkt: 460 - 174.55 = 285.5
       40 tkt: 460 - 232.73 = 227.3
       50 tkt: 460 - 290.91 = 169.1
       Day values (tickets):
       Nov 10: 6 tkts  -> Y = 460 - (6 * 5.818)  = 425.1
       Nov 11: 11 tkts -> Y = 460 - (11 * 5.818) = 396.0
       Nov 12: 7 tkts  -> Y = 460 - (7 * 5.818)  = 419.3
       Nov 13: 12 tkts -> Y = 460 - (12 * 5.818) = 390.2
       Nov 14: 9 tkts  -> Y = 460 - (9 * 5.818)  = 407.6
       Nov 15: 49 tkts -> Y = 460 - (49 * 5.818) = 174.9 (Peak weekend spike!)
  -->

  <!-- Horizontal Grid Lines -->
  <g stroke="#312e81" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="460" x2="880" y2="460" stroke-dasharray="0" stroke="#475569" stroke-width="1.5" />
    <line x1="100" y1="402" x2="880" y2="402" />
    <line x1="100" y1="344" x2="880" y2="344" />
    <line x1="100" y1="285" x2="880" y2="285" />
    <line x1="100" y1="227" x2="880" y2="227" />
    <line x1="100" y1="169" x2="880" y2="169" />
  </g>

  <!-- Y-Axis Labels -->
  <g fill="#94a3b8" font-size="12" text-anchor="end">
    <text x="85" y="464">0</text>
    <text x="85" y="406">10</text>
    <text x="85" y="348">20</text>
    <text x="85" y="289">30</text>
    <text x="85" y="231">40</text>
    <text x="85" y="173">50</text>
    <text x="40" y="260" fill="#cbd5e1" font-size="12" font-weight="600" transform="rotate(-90 40 260)" text-anchor="middle">Tickets Sold / Day</text>
  </g>

  <!-- Filled Area Under Trend Curve -->
  <polygon points="120,460 120,425.1 268,396.0 416,419.3 564,390.2 712,407.6 860,174.9 860,460" fill="url(#areaGrad)" />

  <!-- Trend Line -->
  <polyline points="120,425.1 268,396.0 416,419.3 564,390.2 712,407.6 860,174.9" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Data Points and Badges -->
  <!-- Nov 10 -->
  <circle cx="120" cy="425.1" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  <rect x="85" y="388" width="70" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="120" y="404" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">6 tkts (2)</text>

  <!-- Nov 11 -->
  <circle cx="268" cy="396.0" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  <rect x="233" y="358" width="70" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="268" y="374" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">11 tkts (2)</text>

  <!-- Nov 12 -->
  <circle cx="416" cy="419.3" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
  <rect x="381" y="380" width="70" height="24" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
  <text x="416" y="396" fill="#818cf8" font-size="11" font-weight="bold" text-anchor="middle">7 tkts (2)</text>

  <!-- Nov 13 -->
  <circle cx="564" cy="390.2" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
  <rect x="529" y="352" width="70" height="24" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
  <text x="564" y="368" fill="#818cf8" font-size="11" font-weight="bold" text-anchor="middle">12 tkts (3)</text>

  <!-- Nov 14 -->
  <circle cx="712" cy="407.6" r="7" fill="#c084fc" stroke="#ffffff" stroke-width="2" />
  <rect x="677" y="370" width="70" height="24" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
  <text x="712" y="386" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">9 tkts (3)</text>

  <!-- Nov 15: Spike Callout -->
  <circle cx="860" cy="174.9" r="9" fill="#f43f5e" stroke="#ffffff" stroke-width="2.5" />
  <rect x="765" y="115" width="130" height="42" rx="6" fill="#881337" stroke="#fb7185" stroke-width="1.5" />
  <text x="830" y="134" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">49 tkts (13 orders)</text>
  <text x="830" y="150" fill="#fecdd3" font-size="10" text-anchor="middle">★ Sunday Pre-Booking Rush</text>

  <!-- X-Axis Dates & Subtitles -->
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="120" y="488" fill="#cbd5e1" font-weight="600">Nov 10</text>
    <text x="120" y="504" font-size="11">Tuesday</text>

    <text x="268" y="488" fill="#cbd5e1" font-weight="600">Nov 11</text>
    <text x="268" y="504" font-size="11">Wednesday</text>

    <text x="416" y="488" fill="#cbd5e1" font-weight="600">Nov 12</text>
    <text x="416" y="504" font-size="11">Thursday</text>

    <text x="564" y="488" fill="#cbd5e1" font-weight="600">Nov 13</text>
    <text x="564" y="504" font-size="11">Friday</text>

    <text x="712" y="488" fill="#cbd5e1" font-weight="600">Nov 14</text>
    <text x="712" y="504" font-size="11">Saturday</text>

    <text x="860" y="488" fill="#f43f5e" font-weight="bold">Nov 15</text>
    <text x="860" y="504" font-size="11" fill="#fca5a5">Sunday (Peak)</text>
  </g>

  <!-- Footer Information -->
  <line x1="35" y1="535" x2="915" y2="535" stroke="#312e81" stroke-width="1" />
  <text x="45" y="558" fill="#818cf8" font-size="11">Format: [Tickets Sold (Total Booking Transactions)] • Massive surge observed on Nov 15 prior to show opening</text>
  <text x="905" y="558" fill="#818cf8" font-size="11" text-anchor="end">Velalar College of Engineering and Technology (Autonomous)</text>
</svg>
