  <text x="490" y="23" fill="#aaa" font-size="13" text-anchor="middle">MySQL – Show Occupancy View + Customer Spending Query</text>
  <!-- Query 1 -->
  <text x="20" y="58" fill="#888888" font-size="11">-- View: vw_revenue_report (Show-wise Occupancy Report)</text>
  <text x="20" y="76" fill="#569cd6" font-size="12">SELECT</text><text x="80" y="76" fill="#d4d4d4" font-size="12"> * FROM vw_revenue_report ORDER BY occupancy_pct DESC;</text>
