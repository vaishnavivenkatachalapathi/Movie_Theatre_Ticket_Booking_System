  <!-- Query 2 -->
  <text x="20" y="378" fill="#888888" font-size="11">-- Query 15: Top 5 Customers by Total Spending</text>
  <text x="20" y="396" fill="#569cd6" font-size="12">SELECT</text><text x="80" y="396" fill="#d4d4d4" font-size="12"> c.full_name, c.email, COUNT(b.booking_id) bookings, SUM(b.total_amount) total_spent</text>
  <text x="20" y="414" fill="#569cd6" font-size="12">FROM</text><text x="70" y="414" fill="#d4d4d4" font-size="12"> customers c JOIN bookings b ON c.customer_id=b.customer_id</text>
  <text x="20" y="432" fill="#569cd6" font-size="12">GROUP BY</text><text x="110" y="432" fill="#d4d4d4" font-size="12"> c.customer_id</text><text x="225" y="432" fill="#569cd6" font-size="12"> ORDER BY</text><text x="315" y="432" fill="#d4d4d4" font-size="12"> total_spent DESC LIMIT 5;</text>
  <text x="20" y="454" fill="#28c840" font-size="12">Result: 5 rows returned (0.003 sec)</text>
  <rect x="20" y="464" width="940" height="24" fill="#1a3a5c"/>
  <text x="30" y="480" fill="#00bfff" font-size="12" font-weight="bold">full_name        | bookings | total_spent</text>
